name: Driving brief
# Scheduled:
#   Thu-Sun 3:15 PM New York time: build, deploy the page, push to the phone.
#     Cron is UTC with no DST, so there is one line for EDT and one for EST;
#     brief/gate.py lets through only the line that matches today's offset.
#   Daily ~6 AM: refresh the page; deploy only if what it says changed.
#   GitHub's scheduler can run hours late, so the 3:15 push is also started on
#   time by cron-job.org through the workflow_dispatch API (mode scheduled-push).
#   Automatic pushes are guarded: at most one per day, never after driving starts.
# Manual (Run workflow):
#   dry-run prints only; page deploys the site; push deploys and always notifies.
on:
  schedule:
    - cron: "15 19 * * 0,4,5,6"   # 3:15 PM EDT (UTC-4)
    - cron: "15 20 * * 0,4,5,6"   # 3:15 PM EST (UTC-5)
    - cron: "40 10 * * *"         # 6:40 AM EDT / 5:40 AM EST, page refresh
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints only; page deploys the site; push deploys and notifies"
        type: choice
        options: [dry-run, page, push, scheduled-push]
        default: dry-run
      now:
        description: "Optional 'now' override, e.g. 2026-11-07T15:15 (America/New_York)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.gate.outputs.mode }}
      publish: ${{ steps.build.outputs.publish }}
      send: ${{ steps.build.outputs.send }}
      already_sent: ${{ steps.build.outputs.already_sent }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-brief.txt
      - name: Install brief dependencies
        run: pip install -r requirements-brief.txt
      - name: Decide what this run does
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
        run: python -m brief.gate
      - name: Look up the Pages address
        id: pages
        if: contains(fromJSON('["page","push","refresh"]'), steps.gate.outputs.mode)
        uses: actions/configure-pages@v5
      - name: Build brief
        id: build
        if: steps.gate.outputs.mode != 'skip'
        env:
          MODE: ${{ steps.gate.outputs.mode == 'refresh' && 'refresh' || (steps.gate.outputs.mode == 'dry-run' && 'dry-run' || 'page') }}
          NOW: ${{ inputs.now }}
          PUSH_RUN: ${{ steps.gate.outputs.mode == 'push' }}
          GUARD: ${{ steps.gate.outputs.guard }}
          PAGE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}
        run: |
          args=(--mode "$MODE" --out site --push-file push.json)
          if [ -n "$NOW" ]; then args+=(--now "$NOW"); fi
          if [ "$PUSH_RUN" = "true" ]; then args+=(--push-run); fi
          if [ "$GUARD" = "true" ]; then args+=(--guard); fi
          python -m brief "${args[@]}"
      - name: Upload site
        if: steps.build.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Keep the push for after deploy
        if: steps.build.outputs.send == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: push
          path: push.json
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fail after 5 minutes instead of hanging; the push still goes out (see notify).
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

  # The push doesn't depend on Pages: if deploy failed, it's sent without the link.
  notify:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success' && needs.build.outputs.send == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-brief.txt
      - run: pip install -r requirements-brief.txt
      - uses: actions/download-artifact@v4
        with:
          name: push
      - name: Send push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_DEPLOYED: ${{ needs.deploy.result == 'success' }}
          # Private sheet (on-call, blockers). Read only here, never logged or saved.
          GOOGLE_SA_KEY: ${{ secrets.GOOGLE_SA_KEY }}
          PRIVATE_SHEET_ID: ${{ secrets.PRIVATE_SHEET_ID }}
        run: python -m brief --mode send --push-file push.json

  # Dead-man check: tell Healthchecks.io that today's brief went out. If no ping
  # arrives by ~3:45 PM on a driving day, Healthchecks alerts the phone (ntfy).
  heartbeat:
    needs: [build, notify]
    if: >-
      always() && needs.build.outputs.mode == 'push' &&
      (needs.notify.result == 'success' || needs.build.outputs.already_sent == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Healthchecks.io
        env:
          HC_PING_URL: ${{ secrets.HC_PING_URL }}
        run: |
          if [ -z "$HC_PING_URL" ]; then echo "HC_PING_URL not set; skipping."; exit 0; fi
          curl -fsS -m 10 --retry 3 -o /dev/null "$HC_PING_URL" && echo "Heartbeat sent."

  # If any job failed or timed out on a push run, say so instead of staying silent.
  alert:
    needs: [build, deploy, notify]
    # A timed-out job reports "cancelled", not "failure", so check each result.
    # A scheduled push run whose build died before the gate ran has no mode
    # output; alert for those too (the 3:15 slots are the push crons).
    # A guard skip (already sent / too late) is not a failure.
    if: >-
      always() &&
      (needs.build.outputs.mode == 'push' || inputs.mode == 'push' || inputs.mode == 'scheduled-push' ||
       (github.event_name == 'schedule' && github.event.schedule != '40 10 * * *' &&
        needs.build.outputs.mode == '')) &&
      (needs.build.result != 'success' ||
       (needs.build.outputs.publish == 'true' && needs.deploy.result != 'success') ||
       (needs.build.outputs.send == 'true' && needs.notify.result != 'success'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": "Gig brief failed",
                             "message": "Part of today's brief failed (build, page or push). Check the run.",
                             "tags": ["rotating_light"], "priority": 4,
                             "click": os.environ["RUN_URL"]}).encode()
          req = urllib.request.Request("https://ntfy.sh", data=body,
                                       headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=10)
          PY
