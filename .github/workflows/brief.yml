name: Driving brief
# Manual runs only for now; the schedule (with DST gating) arrives in a later PR.
#   dry-run: print the brief and the push it would send. Nothing published.
#   page:    build and deploy the GitHub Pages site.
#   push:    page, then send today's push (linking to the fresh page).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints only; page deploys the site; push deploys and notifies"
        type: choice
        options: [dry-run, page, push]
        default: dry-run
      now:
        description: "Optional 'now' override, e.g. 2026-11-07T15:15 (America/New_York)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      publish: ${{ steps.mode.outputs.publish }}
    steps:
      - id: mode
        run: echo "publish=${{ inputs.mode != 'dry-run' }}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-brief.txt
      - name: Install brief dependencies
        run: pip install -r requirements-brief.txt
      - name: Look up the Pages address
        id: pages
        if: steps.mode.outputs.publish == 'true'
        uses: actions/configure-pages@v5
      - name: Build brief
        env:
          MODE: ${{ steps.mode.outputs.publish == 'true' && 'page' || 'dry-run' }}
          NOW: ${{ inputs.now }}
          PAGE_URL: ${{ steps.pages.outputs.base_url && format('{0}/', steps.pages.outputs.base_url) || '' }}
        run: |
          args=(--mode "$MODE" --out site --push-file push.json)
          if [ -n "$NOW" ]; then args+=(--now "$NOW"); fi
          python -m brief "${args[@]}"
      - name: Upload site
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - name: Keep the push for after deploy
        if: steps.mode.outputs.publish == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: push
          path: push.json
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Fail after 5 minutes instead of hanging; the push still goes out (see notify).
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 300000

  # The push doesn't depend on Pages: if deploy failed, it's sent without the link.
  notify:
    needs: [build, deploy]
    if: always() && inputs.mode == 'push' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-brief.txt
      - run: pip install -r requirements-brief.txt
      - uses: actions/download-artifact@v4
        with:
          name: push
      - name: Send push
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PAGE_DEPLOYED: ${{ needs.deploy.result == 'success' }}
        run: python -m brief --mode send --push-file push.json

  # If any job failed or timed out on a push run, say so instead of staying silent.
  alert:
    needs: [build, deploy, notify]
    # A timed-out job reports "cancelled", not "failure", so check each result.
    if: >-
      always() && inputs.mode == 'push' &&
      (needs.build.result != 'success' || needs.deploy.result != 'success' ||
       needs.notify.result != 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send failure alert
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          python3 - <<'PY'
          import json, os, urllib.request
          body = json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": "Gig brief failed",
                             "message": "Part of today's brief failed (build, page or push). Check the run.",
                             "tags": ["rotating_light"], "priority": 4,
                             "click": os.environ["RUN_URL"]}).encode()
          req = urllib.request.Request("https://ntfy.sh", data=body,
                                       headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=10)
          PY
