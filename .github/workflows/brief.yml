name: Driving brief
# Manual runs only for now; the schedule (with DST gating) arrives in a later PR.
#   dry-run: print the brief and the push it would send. No secrets used.
#   push:    same, then send today's push to ntfy (NTFY_TOPIC secret).
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run prints only; push also sends to your phone"
        type: choice
        options: [dry-run, push]
        default: dry-run
      now:
        description: "Optional 'now' override, e.g. 2026-11-07T15:15 (America/New_York)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-brief.txt
      - name: Install brief dependencies
        run: pip install -r requirements-brief.txt
      - name: Build brief
        env:
          MODE: ${{ inputs.mode || 'dry-run' }}
          NOW: ${{ inputs.now }}
          NTFY_TOPIC: ${{ inputs.mode == 'push' && secrets.NTFY_TOPIC || '' }}
        run: |
          args=(--mode "$MODE")
          if [ -n "$NOW" ]; then args+=(--now "$NOW"); fi
          python -m brief "${args[@]}"
      # If anything above failed on a push run, say so instead of staying silent.
      - name: Alert on failure
        if: failure() && inputs.mode == 'push'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$NTFY_TOPIC" ] || exit 0
          python - <<'PY'
          import json, os, urllib.request
          body = json.dumps({"topic": os.environ["NTFY_TOPIC"], "title": "Gig brief failed",
                             "message": "Today's brief didn't build or send. Check the run.",
                             "tags": ["rotating_light"], "priority": 4,
                             "click": os.environ["RUN_URL"]}).encode()
          req = urllib.request.Request("https://ntfy.sh", data=body,
                                       headers={"Content-Type": "application/json"})
          urllib.request.urlopen(req, timeout=10)
          PY
